[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-config-toolkit"
version = "0.1.0"
description = "Configurable Excel previews, reviewed transactions, and compact knowledge collections"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.0"]

[project.scripts]
ai-config = "config_toolkit.tools.config_workflow:main"
ai-knowledge = "config_toolkit.tools.knowledge:main"
ai-config-plan = "config_toolkit.tools.config_plan:main"

[tool.setuptools.packages.find]
include = ["config_toolkit*"]
